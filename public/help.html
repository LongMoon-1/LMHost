<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LMHost - 帮助中心</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
    --bg: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
    --border: #30363d; --text: #c9d1d9; --text-secondary: #8b949e;
    --text-muted: #484f58; --accent: #58a6ff; --radius: 6px;
    --transition: all 0.15s ease; --sidebar-width: 200px;
}
[data-theme="light"] {
    --bg: #fff; --bg-secondary: #f6f8fa; --bg-tertiary: #eaeef2;
    --border: #d0d7de; --text: #1f2328; --text-secondary: #656d76;
    --text-muted: #8c959f; --accent: #0969da;
}
@media (prefers-color-scheme: light) {
    [data-theme="auto"] {
        --bg: #fff; --bg-secondary: #f6f8fa; --bg-tertiary: #eaeef2;
        --border: #d0d7de; --text: #1f2328; --text-secondary: #656d76;
        --text-muted: #8c959f; --accent: #0969da;
    }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { touch-action: manipulation; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-decoration: none; }
.topbar { position: sticky; top: 0; z-index: 100; background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 50px; }
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar .logo { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
.topbar .logo i { color: var(--accent); }
.back-btn, .lang-btn { background: none; border: none; color: var(--text-secondary); font-size: 0.88rem; cursor: pointer; padding: 6px 10px; border-radius: var(--radius); font-family: inherit; display: flex; align-items: center; gap: 4px; }
.back-btn:hover, .lang-btn:hover { background: var(--bg-tertiary); color: var(--text); }
.container { display: flex; min-height: calc(100vh - 50px); }
.sidebar { width: var(--sidebar-width); flex-shrink: 0; background: var(--bg-secondary); border-right: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.sidebar-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius); border: none; background: none; color: var(--text); font-size: 0.88rem; cursor: pointer; transition: var(--transition); text-align: left; width: 100%; font-family: inherit; }
.sidebar-item:hover { background: var(--bg-tertiary); }
.sidebar-item.active { background: var(--bg-tertiary); color: var(--accent); font-weight: 600; }
.sidebar-item i { width: 18px; text-align: center; }
.mobile-tabs { display: none; overflow-x: auto; border-bottom: 1px solid var(--border); background: var(--bg-secondary); -webkit-overflow-scrolling: touch; }
.mobile-tabs .tab-btn { flex-shrink: 0; padding: 10px 16px; border: none; background: none; color: var(--text-secondary); font-size: 0.85rem; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; transition: var(--transition); font-family: inherit; white-space: nowrap; }
.mobile-tabs .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.content { flex: 1; padding: 16px 20px; max-width: 700px; }
.category-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; }
.help-list { list-style: none; }
.help-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
.help-item:hover { background: var(--bg-tertiary); }
.help-item .item-text { font-size: 0.92rem; flex: 1; }
.help-item .item-arrow { color: var(--text-muted); font-size: 0.8rem; margin-left: 8px; flex-shrink: 0; }
.detail-page { position: fixed; inset: 0; z-index: 300; background: var(--bg); display: flex; flex-direction: column; animation: slideIn 0.2s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.detail-topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 50px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
.detail-back-btn { background: none; border: none; color: var(--text-secondary); font-size: 0.88rem; cursor: pointer; padding: 6px 10px; border-radius: var(--radius); font-family: inherit; display: flex; align-items: center; gap: 4px; }
.detail-back-btn:hover { background: var(--bg-tertiary); color: var(--text); }
.detail-title { font-weight: 600; font-size: 0.95rem; }
.detail-body { flex: 1; padding: 20px; overflow-y: auto; max-width: 700px; margin: 0 auto; width: 100%; font-size: 0.9rem; color: var(--text-secondary); line-height: 1.8; }
.detail-body strong { color: var(--text); }
.detail-body code { background: var(--bg-tertiary); padding: 2px 6px; border-radius: 4px; font-size: 0.82rem; color: var(--accent); }
@media (max-width: 640px) { .sidebar { display: none; } .mobile-tabs { display: flex; } .content { padding: 12px 14px; } }
</style>
</head>
<body>

<header class="topbar" id="mainTopbar">
    <div class="topbar-left">
        <button class="back-btn" onclick="window.location.href='/'"><i class="fa-solid fa-arrow-left"></i> <span id="btnBackHome">首页</span></button>
        <div class="logo"><i class="fa-solid fa-circle-question"></i> <span id="topbarTitle">帮助中心</span></div>
    </div>
    <button class="lang-btn" id="langSwitchBtn"></button>
</header>

<div class="mobile-tabs" id="mobileTabs"></div>
<div class="container" id="mainContainer">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content"></main>
</div>

<script>
function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? decodeURIComponent(match[2]) : null;
}
(function() {
    document.documentElement.setAttribute('data-theme', getCookie('lmhost_theme') || 'auto');
})();

const zh = {
    topbarTitle: '帮助中心', btnBackHome: '首页',
    categories: [
        { id: 'login', icon: 'fa-key', name: '登录问题' },
        { id: 'guide', icon: 'fa-book', name: '使用引导' },
        { id: 'features', icon: 'fa-puzzle-piece', name: '功能问题' },
        { id: 'cookie', icon: 'fa-cookie-bite', name: 'Cookie' }
    ],
    items: {
        login: [
            { q: '忘记密码怎么办？', a: '目前 LMHost 暂不支持自助找回密码。如果您忘记了密码，请<strong>重新注册一个新账号</strong>。如果已登录，可在<strong>设置 → 修改密码</strong>中更改密码。' },
            { q: '账号被锁定了怎么办？', a: '连续输入错误密码 <strong>5 次</strong>，账号将被<strong>临时锁定 1 分钟</strong>。请耐心等待后重试，或注册新账号。' },
            { q: '为什么登录失败？', a: '请检查用户名密码是否正确、是否被临时锁定、网络是否正常。' },
            { q: '为什么会提示 429 错误？', a: '<strong>频率限制</strong>：登录/注册每分钟最多 15 次请求。等待一分钟后重试。' }
        ],
        guide: [
            { q: '如何创建一个网站？', a: '<strong>1. 上传文件：</strong>拖拽或点击选择 HTML 文件，填写名称，点击「部署网站」。<br><br><strong>2. 粘贴代码：</strong>粘贴 HTML 代码，填写名称，点击「部署网站」。<br><br>部署成功后获得链接：<code>/h/标识</code>' },
            { q: '如何访问已部署的网站？', a: '在<strong>「我的网站」</strong>中点击卡片，再点击<strong>「访问」</strong>按钮。链接格式：<code>域名/h/标识</code>。' },
            { q: '如何编辑我的网站？', a: '点击网站卡片 → 修改名称 → 点击「更新 HTML」编辑代码 → 「应用」→「保存修改」。下方可实时预览。' },
            { q: '如何删除网站？', a: '点击网站卡片 → 点击红色<strong>「删除」</strong>按钮 → 确认。此操作不可撤销。' },
            { q: '如何查看网站访问量？', a: '网站卡片上显示<strong>访问次数</strong>（眼睛图标）。点击卡片可看详情。' }
        ],
        features: [
            { q: '如何切换主题颜色？', a: '进入<strong>「设置」</strong>→「通用设置」→「主题颜色」下拉选择。' },
            { q: '如何切换语言？', a: '进入<strong>「设置」</strong>→「通用设置」→「语言设置」下拉选择。' },
            { q: '如何修改昵称？', a: '进入<strong>「设置」</strong>→「个人设置」→ 修改昵称保存。' },
            { q: '如何修改密码？', a: '进入<strong>「设置」</strong>→「修改密码」输入旧密码和新密码。' },
            { q: '危险操作有哪些？', a: '<strong>删除所有网站</strong>和<strong>注销账号</strong>均不可恢复，操作前有二次确认。' }
        ],
        cookie: [
            { q: '什么是 Cookie？', a: 'Cookie 是存储在您浏览器中的小型数据文件，用于保存您的登录状态、主题偏好和语言设置。' },
            { q: '为什么需要接受 Cookie？', a: '接受 Cookie 后，您的登录状态、主题和语言偏好会被持久保存。拒绝 Cookie 将使用临时内存存储，关闭浏览器后数据会丢失。' },
            { q: '如何重置 Cookie？', a: '进入<strong>「设置」</strong>→「Cookie」→ 点击「重置 Cookie」。此操作将清除所有本地数据，下次进入需重新登录并授权 Cookie。' },
            { q: 'Cookie 安全吗？', a: 'LMHost 使用的 Cookie 不包含敏感个人信息，令牌经过加密，且设置了 SameSite 保护。' }
        ]
    },
    langSwitchLabel: 'English', detailBack: '返回'
};

const en = {
    topbarTitle: 'Help Center', btnBackHome: 'Home',
    categories: [
        { id: 'login', icon: 'fa-key', name: 'Login Issues' },
        { id: 'guide', icon: 'fa-book', name: 'Usage Guide' },
        { id: 'features', icon: 'fa-puzzle-piece', name: 'Features' },
        { id: 'cookie', icon: 'fa-cookie-bite', name: 'Cookie' }
    ],
    items: {
        login: [
            { q: 'Forgot password?', a: 'Password recovery is not supported. Please <strong>register a new account</strong>. If logged in, change in <strong>Settings → Change Password</strong>.' },
            { q: 'Account locked?', a: '<strong>5 failed attempts</strong> = <strong>1 minute lock</strong>. Wait and retry, or register new account.' },
            { q: 'Why can\'t I login?', a: 'Check username/password, lock status, and network.' },
            { q: 'Why 429 error?', a: '<strong>Rate limit:</strong> 15 requests/min. Wait and retry.' }
        ],
        guide: [
            { q: 'How to create a site?', a: '<strong>1. Upload File:</strong> Select HTML, enter name, click "Deploy Site".<br><br><strong>2. Paste Code:</strong> Paste HTML, enter name, click "Deploy Site".<br><br>Link: <code>/h/your-id</code>' },
            { q: 'How to visit a deployed site?', a: 'Find in <strong>"My Sites"</strong>, click card, click <strong>"Visit"</strong>. Link: <code>domain/h/id</code>' },
            { q: 'How to edit a site?', a: 'Click site card → edit name → click "Update HTML" → "Apply" → "Save Changes". Live preview below.' },
            { q: 'How to delete a site?', a: 'Click card → red <strong>"Delete"</strong> → confirm. Cannot be undone.' },
            { q: 'How to check visit count?', a: 'Visible on cards (eye icon). Click for details.' }
        ],
        features: [
            { q: 'How to switch theme?', a: '<strong>Settings</strong> → Theme dropdown.' },
            { q: 'How to switch language?', a: '<strong>Settings</strong> → Language dropdown.' },
            { q: 'How to change nickname?', a: '<strong>Settings</strong> → Profile → Save.' },
            { q: 'How to change password?', a: '<strong>Settings</strong> → Change Password.' },
            { q: 'Danger zone actions?', a: '<strong>Delete All Sites</strong> and <strong>Delete Account</strong> are permanent.' }
        ],
        cookie: [
            { q: 'What is a Cookie?', a: 'A small data file stored in your browser to save login state, theme, and language preferences.' },
            { q: 'Why accept Cookies?', a: 'Accepting Cookies allows persistent storage of your preferences. Rejecting uses temporary memory that clears when the browser closes.' },
            { q: 'How to reset Cookies?', a: 'Go to <strong>Settings</strong> → Cookie → click "Reset Cookie". All local data will be cleared and you will need to log in again.' },
            { q: 'Are Cookies safe?', a: 'LMHost Cookies contain no sensitive personal data. Tokens are encrypted and protected with SameSite.' }
        ]
    },
    langSwitchLabel: '中文', detailBack: 'Back'
};

function detectSystemLang() { return (navigator.language || 'en').startsWith('zh') ? 'zh' : 'en'; }
let currentLang = detectSystemLang();
let t = currentLang === 'zh' ? zh : en;

function $(s) { return document.querySelector(s); }
function renderSidebar() {
    const sidebar = $('#sidebar');
    sidebar.innerHTML = t.categories.map(c => `<button class="sidebar-item${c.id===activeCategory?' active':''}" data-cat="${c.id}"><i class="fa-solid ${c.icon}"></i> ${c.name}</button>`).join('');
    sidebar.querySelectorAll('.sidebar-item').forEach(b => b.onclick = () => { activeCategory = b.dataset.cat; renderAll(); });
}
function renderMobileTabs() {
    const c = $('#mobileTabs');
    c.innerHTML = t.categories.map(cat => `<button class="tab-btn${cat.id===activeCategory?' active':''}" data-cat="${cat.id}">${cat.name}</button>`).join('');
    c.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { activeCategory = b.dataset.cat; renderAll(); });
}
function renderContent() {
    const items = t.items[activeCategory] || [];
    $('#content').innerHTML = `<h2 class="category-title">${t.categories.find(c=>c.id===activeCategory).name}</h2><ul class="help-list">${items.map((it,i)=>`<li><div class="help-item" data-idx="${i}"><span class="item-text">${it.q}</span><i class="fa-solid fa-chevron-right item-arrow"></i></div></li>`).join('')}</ul>`;
    document.querySelectorAll('.help-item').forEach(el => el.onclick = () => {
        const item = items[parseInt(el.dataset.idx)];
        if (item) openDetail(item.q, item.a);
    });
}
function openDetail(title, body) {
    const page = document.createElement('div'); page.className = 'detail-page';
    page.innerHTML = `<div class="detail-topbar"><button class="detail-back-btn"><i class="fa-solid fa-arrow-left"></i> ${t.detailBack}</button><span class="detail-title">${title}</span><span style="width:60px;"></span></div><div class="detail-body">${body}</div>`;
    document.body.appendChild(page); page.querySelector('.detail-back-btn').onclick = () => page.remove();
}
let activeCategory = t.categories[0].id;
function renderAll() {
    $('#topbarTitle').textContent = t.topbarTitle;
    $('#btnBackHome').textContent = t.btnBackHome;
    $('#langSwitchBtn').textContent = t.langSwitchLabel;
    renderSidebar(); renderMobileTabs(); renderContent();
}
$('#langSwitchBtn').onclick = () => { currentLang = currentLang==='zh'?'en':'zh'; t = currentLang==='zh'?zh:en; activeCategory = t.categories[0].id; renderAll(); };
renderAll();
</script>
</body>
</html>
